apiVersion: apps/v1
kind: Deployment
metadata:
  name: evidenceroll
  labels:
    app.kubernetes.io/name: evidenceroll
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: evidenceroll
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evidenceroll
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: evidenceroll
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: control-plane
          image: ghcr.io/marckmorris/evidenceroll:0.1.0
          imagePullPolicy: IfNotPresent
          args: ["serve", "--home", "/var/lib/evidenceroll", "--policy", "/etc/evidenceroll/policy.yaml"]
          env:
            - name: EVIDENCEROLL_BOOTSTRAP_FIXTURES
              value: "true"
            - name: EVIDENCEROLL_RECONCILE_INTERVAL_SECONDS
              value: "15"
            - name: EVIDENCEROLL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: evidenceroll-secrets
                  key: api-key
                  optional: true
            - name: EVIDENCEROLL_AUDIT_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: evidenceroll-secrets
                  key: audit-hmac-key
                  optional: true
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
            runAsUser: 10001
            runAsGroup: 10001
          volumeMounts:
            - {name: data, mountPath: /var/lib/evidenceroll}
            - {name: policy, mountPath: /etc/evidenceroll, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: evidenceroll-data}
        - name: policy
          configMap: {name: evidenceroll-policy}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
