apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: evidenceroll-default-deny
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: evidenceroll
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - {protocol: TCP, port: 8080}
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 8080}
    - to:
        - namespaceSelector: {}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}

