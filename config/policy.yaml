schema_version: 1
policy_id: standard-v1
evidence:
  min_predictions: 120
  min_labels: 90
  min_label_coverage: 0.70
  max_age_seconds: 86400
  # Widest tolerated label-coverage gap between two readable segments (served role, predicted
  # class, or a reference-profile feature bin). Below two readable segments, or a gap above this
  # value, holds with LABEL_MISSINGNESS_UNVERIFIED / BIASED_LABEL_MISSINGNESS. Set to 1.0 to
  # disable the check (see docs/adr — selective feedback biases the measured release delta).
  max_label_coverage_gap: 0.25
  # A segment needs at least this many predictions before its coverage is reported; smaller
  # segments are too noisy to gate on.
  min_segment_predictions: 30
proxy_gates:
  max_feature_psi: 0.35
  max_disagreement_rate: 0.45
quality_gates:
  non_inferiority_margin: 0.08
  max_brier_regression: 0.03
operational_gates:
  max_challenger_p95_latency_ms: 75.0
rollout:
  initial_canary_weight: 10
